<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Worthington Nutrition</title>
    <script>
      window.MENU_API_URL = "https://worthingtonnutritionsite.onrender.com";
    </script>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" href="./favicon.ico" />
  </head>
  <body>
    <header>
      <h1>Worthington Online Nutrition Menu</h1>
    </header>
<section class="everything-else">
    <div class="search-wrapper">
      <input
        type="text"
        id="search-input"
        placeholder="Search for products..."
      />
    </div>

    <div id="menu-container"></div>
    </section>

    <div id="popup" class="popup hidden">
      <div class="popup-content">
        <span id="close-popup">&times;</span>
        <h2 id="popup-title"></h2>
        <div id="popup-details"></div>
      </div>
    </div>

    <div id="duplicate-upc-popup" class="confirm-popup hidden">
      <div class="confirm-box">
        <p>This UPC is already saved. Replace it?</p>
        <div class="confirm-actions">
          <button
            id="dup-yes"
            type="button"
            class="confirm-btn confirm-primary"
          >
            Yes
          </button>
          <button
            id="dup-no"
            type="button"
            class="confirm-btn confirm-secondary"
          >
            No
          </button>
        </div>
      </div>
    </div>

    <script src="./api-config.js?v=20260827-2"></script>
    <script type="module" src="./index.js?v=20260827-2"></script>
    <script src="./extension-overlay.js?v=20260827-2"></script>
  </body>
</html>
